<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Tareas Corporativo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .card { margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .estado-pendiente { border-left: 5px solid #dc3545; }
    .estado-progreso { border-left: 5px solid #ffc107; }
    .estado-finalizado { border-left: 5px solid #198754; }
  </style>
</head>
<body>

<div class="container mt-4">
  <h1 class="text-center mb-4">Sistema de Gestión de Proyectos</h1>

  <div class="row">
    <div class="col-md-4">

      <div class="card p-3">
        <h4>Nuevo Proyecto</h4>
        <form id="form-proyecto">
          <div class="mb-2">
            <input type="text" id="nombreProyecto" class="form-control" placeholder="Nombre del proyecto" required>
          </div>
          <div class="mb-2">
            <input type="text" id="descProyecto" class="form-control" placeholder="Descripción breve">
          </div>
          <button type="submit" class="btn btn-primary w-100">Crear Proyecto</button>
        </form>
      </div>

      <div class="card p-3">
        <h4>Nueva Tarea</h4>
        <form id="form-tarea">
          <div class="mb-2">
            <select id="selectProyecto" class="form-select" required>
              <option value="" disabled selected>Seleccione un Proyecto...</option>
            </select>
          </div>
          <div class="mb-2">
            <input type="text" id="tituloTarea" class="form-control" placeholder="Título de la tarea" required>
          </div>
          <div class="mb-2">
            <textarea id="descTarea" class="form-control" placeholder="Detalles de la tarea"></textarea>
          </div>
          <button type="submit" class="btn btn-success w-100">Agregar Tarea</button>
        </form>
      </div>
    </div>

    <div class="col-md-8">
      <h4>Tablero de Tareas</h4>
      <div id="lista-tareas">
        <div class="text-center text-muted mt-5">Cargando tareas...</div>
      </div>
    </div>
  </div>
</div>

<script>
  // url de las API
  const API_PROYECTOS = 'api/proyectos';
  const API_TAREAS = 'api/tareas';

  // Carga proyectos
  function cargarProyectos() {
      fetch(API_PROYECTOS)
          .then(response => response.json())
          .then(proyectos => {
              const select = document.getElementById('selectProyecto');
              select.innerHTML = '<option value="" disabled selected>Seleccione un Proyecto...</option>';

              proyectos.forEach(p => {
                  const option = document.createElement('option');
                  option.value = p.id;
                  option.textContent = p.nombre;
                  select.appendChild(option);
              });
          })
          .catch(err => console.error("Error cargando proyectos:", err));
  }

  // cargar tareas
  function cargarTareas() {
      fetch(API_TAREAS)
          .then(response => response.json())
          .then(tareas => {
              const contenedor = document.getElementById('lista-tareas');
              contenedor.innerHTML = ''; // Limpiar

              if (tareas.length === 0) {
                  contenedor.innerHTML = '<div class="alert alert-info">No hay tareas registradas.</div>';
                  return;
              }

              tareas.forEach(t => {
                  // Determinar estilo según estado
                  let bordeClase = '';
                  let badgeColor = '';
                  let textoEstado = t.nombreEstado || 'Desconocido';

                  if (t.estadoId === 1) { bordeClase = 'estado-pendiente'; badgeColor = 'bg-danger'; }
                  else if (t.estadoId === 2) { bordeClase = 'estado-progreso'; badgeColor = 'bg-warning text-dark'; }
                  else if (t.estadoId === 3) { bordeClase = 'estado-finalizado'; badgeColor = 'bg-success'; }

                  //tarjeta
                  const html = `
                      <div class="card p-3 mb-2 ${bordeClase}">
                          <div class="d-flex justify-content-between align-items-center">
                              <h5 class="mb-0">${t.titulo}</h5>
                              <span class="badge ${badgeColor}">${textoEstado}</span>
                          </div>
                          <small class="text-muted">Proyecto: <strong>${t.nombreProyecto}</strong></small>
                          <p class="mt-2 mb-2">${t.descripcion || ''}</p>

                          <div class="btn-group btn-group-sm">
                              ${t.estadoId !== 1 ? `<button class="btn btn-outline-secondary" onclick="cambiarEstado(${t.id}, 1)">Pendiente</button>` : ''}
                              ${t.estadoId !== 2 ? `<button class="btn btn-outline-warning" onclick="cambiarEstado(${t.id}, 2)">En Progreso</button>` : ''}
                              ${t.estadoId !== 3 ? `<button class="btn btn-outline-success" onclick="cambiarEstado(${t.id}, 3)">Finalizar</button>` : ''}
                          </div>
                      </div>
                  `;
                  contenedor.innerHTML += html;
              });
          })
          .catch(err => console.error("Error cargando tareas:", err));
  }

  // REGISTRAR PROYECTO (POST)
  document.getElementById('form-proyecto').addEventListener('submit', function(e) {
      e.preventDefault();
      const data = {
          nombre: document.getElementById('nombreProyecto').value,
          descripcion: document.getElementById('descProyecto').value,
          // La fecha se maneja en backend o se envía actual
      };

      fetch(API_PROYECTOS, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
      }).then(res => res.json()).then(resp => {
          if(resp.exito) {
              alert("Proyecto creado");
              document.getElementById('form-proyecto').reset();
              cargarProyectos(); // Actualizar el select
          } else {
              alert("Error al crear proyecto");
          }
      });
  });

  // REGISTRAR TAREA (POST)
  document.getElementById('form-tarea').addEventListener('submit', function(e) {
      e.preventDefault();
      const data = {
          proyectoId: parseInt(document.getElementById('selectProyecto').value),
          titulo: document.getElementById('tituloTarea').value,
          descripcion: document.getElementById('descTarea').value,
          estadoId: 1 // Siempre nace pendiente
      };

      fetch(API_TAREAS, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
      }).then(res => res.json()).then(resp => {
          if(resp.exito) {
              alert("Tarea agregada");
              document.getElementById('form-tarea').reset();
              cargarTareas(); // Actualizar la lista
          } else {
              alert("Error al crear tarea");
          }
      });
  });

  // CAMBIAR ESTADO (PUT)
  window.cambiarEstado = function(idTarea, nuevoEstado) {
      const data = {
          id: idTarea,
          estadoId: nuevoEstado
      };

      fetch(API_TAREAS, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
      }).then(res => res.json()).then(resp => {
          if(resp.exito) {
              cargarTareas(); // Refrescar para ver el cambio de color
          } else {
              alert("No se pudo actualizar el estado");
          }
      });
  };

  // Inicializar
  cargarProyectos();
  cargarTareas();

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
